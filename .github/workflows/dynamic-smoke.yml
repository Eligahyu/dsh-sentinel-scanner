name: dynamic-smoke

on:
  workflow_dispatch:
    inputs:
      enable_dynamic:
        description: Run the opt-in Phase B Linux smoke gate
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  phase-b-smoke:
    if: ${{ inputs.enable_dynamic == true }}
    # This protected runner is administered with the exact scanner-owned image
    # preloaded. No checkout or other action is needed by the smoke command.
    runs-on: [self-hosted, linux, dsh-sentinel-phase-b]
    environment: dynamic-analysis-protected
    timeout-minutes: 2
    env:
      # This secret is scoped to the explicitly enabled protected job. It is
      # passed only as an image argument and is never echoed.
      DYNAMIC_IMAGE_DIGEST: ${{ secrets.DSH_SENTINEL_DYNAMIC_IMAGE_DIGEST }}
    steps:
      - name: Skip when the scanner-owned immutable image digest is absent
        if: ${{ env.DYNAMIC_IMAGE_DIGEST == '' }}
        shell: bash
        run: |
          echo "SKIP: Phase B unavailable; protected scanner-owned immutable image digest is absent."

      - name: Run the Linux network-denied smoke
        if: ${{ env.DYNAMIC_IMAGE_DIGEST != '' }}
        shell: bash
        working-directory: /
        run: |
          set -euo pipefail
          if [[ "$DYNAMIC_IMAGE_DIGEST" =~ ^[^[:space:]]+@sha256:[[:xdigit:]]{64}$ ]]; then
            :
          else
            echo "FAIL: dynamic image must be a scanner-owned immutable sha256 digest" >&2
            exit 1
          fi

          remote_environment=(
            DOCKER_HOST DOCKER_CONTEXT CONTAINER_HOST CONTAINER_CONNECTION
            DOCKER_CONFIG CONTAINERS_CONF CONTAINERS_STORAGE_CONF
            PODMAN_CONNECTIONS_CONF XDG_CONFIG_HOME
          )
          for variable in "${remote_environment[@]}"; do
            if [[ -n "${!variable-}" ]]; then
              echo "FAIL: Phase B refused; remote engine selector/configuration is set: $variable" >&2
              exit 1
            fi
          done
          unset "${remote_environment[@]}"

          engine=''
          engine_path=''
          endpoint_flag=''
          if [[ -x /usr/bin/docker ]]; then
            engine=docker
            engine_path=/usr/bin/docker
            endpoint_flag=--host=unix:///var/run/docker.sock
          elif [[ -x /usr/bin/podman ]]; then
            engine=podman
            engine_path=/usr/bin/podman
            podman_uid=$(/usr/bin/id -u)
            endpoint_flag="--url=unix:///run/user/${podman_uid}/podman/podman.sock"
          fi
          case "$engine" in
            docker|podman) ;;
            *) echo "SKIP: Phase B unavailable; no allowlisted local Docker or Podman executable is installed."; exit 0 ;;
          esac

          cd /
          if ! /usr/bin/env -i PATH=/usr/bin:/bin HOME=/nonexistent \
            "$engine_path" "$endpoint_flag" image inspect "$DYNAMIC_IMAGE_DIGEST" >/dev/null 2>&1; then
            echo "SKIP: Phase B unavailable; scanner-owned immutable image is not preloaded on this protected runner."
            exit 0
          fi

          /usr/bin/env -i PATH=/usr/bin:/bin HOME=/nonexistent \
            /usr/bin/timeout --signal=TERM --kill-after=10s 90s \
            "$engine_path" "$endpoint_flag" run --rm \
            --pull=never \
            --network=none \
            --pid=private \
            --ipc=private \
            --read-only \
            --tmpfs=/tmp:rw,noexec,nosuid,nodev,size=64m \
            --user=65532:65532 \
            --cap-drop=ALL \
            --security-opt=no-new-privileges \
            --pids-limit=64 \
            --memory=512m \
            --cpus=1 \
            --entrypoint=/usr/local/bin/dsh-sentinel-harness \
            "$DYNAMIC_IMAGE_DIGEST" --smoke
