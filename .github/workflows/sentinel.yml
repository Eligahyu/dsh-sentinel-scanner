# 示例:PR / push 时自动扫描并上传 SARIF 到 GitHub Code Scanning。
#
# 结构(§7.7):scanner step continue-on-error → 无条件上传 SARIF(hashFiles 保护)
# → final gate 依据 exit-code 使 job 失败。SARIF 永远先保留,再失败。
#
# 注意:upload-sarif 需要 permissions.security-events: write。

name: DSH Sentinel

on:
  pull_request:
  push:
    branches: [master, main]

permissions:
  contents: read
  security-events: write

jobs:
  sentinel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Scan
        id: scan
        continue-on-error: true
        uses: ./
        with:
          path: .
          mode: source
          fail-on: high
          fail-on-incomplete: 'false'

      - name: Upload SARIF to Code Scanning
        if: always() && hashFiles('sentinel.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: sentinel.sarif

      - name: Enforce Sentinel
        if: always()
        shell: bash
        run: |
          code="${{ steps.scan.outputs.exit-code }}"
          if [ "$code" != "0" ]; then
            echo "dsh-sentinel exit code: $code (0=ok 1=threshold-exceeded 2=runtime-error 3=incomplete-scan)"
            exit "$code"
          fi
